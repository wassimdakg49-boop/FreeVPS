name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
    - name: Download cloudflared
      run: |
        $ErrorActionPreference = 'Stop'
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
        .\cloudflared.exe --version

    - name: Enable Remote Desktop
      run: |
        $ErrorActionPreference = 'Stop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create RDP user
      run: |
        $ErrorActionPreference = 'Stop'
        $sec = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
        $acct = New-LocalUser -Name 'rdpvm' -Password $sec -PasswordNeverExpires -AccountNeverExpires -FullName 'Free VPS' -Description 'FreeVPS temporary RDP account'
        Add-LocalGroupMember -Group 'Administrators' -Member 'rdpvm'
        Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'rdpvm'
        $acct | Select-Object Name, Enabled, PasswordExpires, AccountExpires | Format-List
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    - name: Open RDP tunnel
      run: |
        $ErrorActionPreference = 'Stop'
        $proc = Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','--url','tcp://localhost:3389','--no-autoupdate' -RedirectStandardOutput cf-out.log -RedirectStandardError cf-err.log -WindowStyle Hidden -PassThru

        $rhost = $null
        $rport = $null
        for ($i = 0; $i -lt 45 -and -not $rhost; $i++) {
          Start-Sleep -Seconds 2
          $txt = ''
          foreach ($f in @('cf-out.log','cf-err.log')) {
            if (Test-Path $f) { $txt += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
          }
          $m = [regex]::Match($txt, 'tcp://(?<h>[a-z0-9-]+\.trycloudflare\.com):(?<p>\d+)')
          if ($m.Success) {
            $rhost = $m.Groups['h'].Value
            $rport = $m.Groups['p'].Value
          }
          if ($proc.HasExited -and -not $rhost) {
            Get-Content cf-err.log -ErrorAction SilentlyContinue
            throw "cloudflared exited early with code $($proc.ExitCode)"
          }
        }
        if (-not $rhost) { Get-Content cf-err.log -ErrorAction SilentlyContinue; throw 'tunnel did not report a hostname in 90s' }

        $user = 'rdpvm'
        $cred = $user + ':' + $Env:RDP_PASSWORD
        $sha1 = [System.Security.Cryptography.SHA1]::Create()
        $md5  = [System.Security.Cryptography.MD5]::Create()
        $hex  = { param($b) ([System.BitConverter]::ToString($b)).Replace('-','').ToLower() }
        $h1   = & $hex $md5.ComputeHash([System.Text.Encoding]::Unicode.GetBytes($cred))
        $h2   = & $hex $sha1.ComputeHash([System.Text.Encoding]::Unicode.GetBytes('TERMSRV/' + $rhost))
        $h3   = & $hex $md5.ComputeHash([System.Text.Encoding]::Unicode.GetBytes($rhost))
        $full = & $hex $md5.ComputeHash([System.Text.Encoding]::Unicode.GetBytes($h1 + $h2 + $h3))
        $b64  = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($full))

        [ordered]@{ host = $rhost; port = $rport; user = $user; rdphash = $b64 } | ConvertTo-Json | Out-File -Encoding utf8 rdpinfo.json
        Get-Content rdpinfo.json

        $lines = @(
          '## Windows VM is live',
          '',
          'This job must stay running. Closing the browser tab does NOT stop it,',
          'but the VM dies when the job ends or hits the 350 minute timeout.',
          '',
          ('- **User:** `' + $user + '`'),
          ('- **Password:** the `RDP_PASSWORD` repository secret'),
          ('- **Connect to:** `' + $rhost + ':' + $rport + '`'),
          '',
          'One-click from a Windows machine:',
          '',
          '```',
          ('mstsc /v:' + $rhost + ':' + $rport + ' /u:' + $user + ' /pth:' + $b64),
          '```',
          '',
          'If `/pth` is ignored, type the host and port in manually.'
        )
        $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    - name: Keep session alive
      run: |
        $ErrorActionPreference = 'Stop'
        while ($true) {
          Start-Sleep -Seconds 60
          if (-not (Get-Process cloudflared -ErrorAction SilentlyContinue)) {
            Write-Host 'cloudflared died; restarting'
            Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','--url','tcp://localhost:3389','--no-autoupdate' -RedirectStandardOutput cf-out2.log -RedirectStandardError cf-err2.log -WindowStyle Hidden
          }
        }
