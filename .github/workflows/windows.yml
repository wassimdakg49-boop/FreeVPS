name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
    - name: Download cloudflared
      run: |
        $ErrorActionPreference = 'Stop'
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
        .\cloudflared.exe --version

    - name: Enable Remote Desktop
      run: |
        $ErrorActionPreference = 'Stop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create RDP user
      run: |
        $ErrorActionPreference = 'Stop'
        $sec = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
        $acct = New-LocalUser -Name 'rdpvm' -Password $sec -PasswordNeverExpires -AccountNeverExpires -FullName 'Free VPS' -Description 'FreeVPS temporary RDP account'
        Add-LocalGroupMember -Group 'Administrators' -Member 'rdpvm'
        Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'rdpvm'
        $acct | Select-Object Name, Enabled, PasswordExpires, AccountExpires | Format-List
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    - name: Run Windows VM
      run: |
        $ErrorActionPreference = 'Stop'

        function Start-Tunnel([int]$n) {
          $out = "cf-$n.log"
          $p = Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','--url','tcp://localhost:3389','--no-autoupdate' -RedirectStandardOutput $out -RedirectStandardError "$out.err" -WindowStyle Hidden -PassThru
          return [pscustomobject]@{ Proc = $p; Out = $out }
        }

        function Get-TunnelHost($t) {
          $txt = ''
          foreach ($f in @($t.Out, ($t.Out + '.err'))) {
            if (Test-Path $f) { $txt += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
          }
          $m = [regex]::Match($txt, '(?:tcp|https?)://(?<h>[a-z0-9-]+\.trycloudflare\.com)(?::(?<p>\d+))?')
          if ($m.Success) {
            $port = '3389'
            if ($m.Groups['p'].Success) { $port = $m.Groups['p'].Value }
            return [pscustomobject]@{ Host = $m.Groups['h'].Value; Port = $port }
          }
          return $null
        }

        function Write-ConnectInfo([string]$h, [string]$port, [int]$attempt) {
          $user = 'rdpvm'
          $cred = $user + ':' + $Env:RDP_PASSWORD
          $sha1 = [System.Security.Cryptography.SHA1]::Create()
          $md5  = [System.Security.Cryptography.MD5]::Create()
          $hex  = { param($b) ([System.BitConverter]::ToString($b)).Replace('-','').ToLower() }
          $h1   = & $hex $md5.ComputeHash([Text.Encoding]::Unicode.GetBytes($cred))
          $h2   = & $hex $sha1.ComputeHash([Text.Encoding]::Unicode.GetBytes('TERMSRV/' + $h))
          $h3   = & $hex $md5.ComputeHash([Text.Encoding]::Unicode.GetBytes($h))
          $full = & $hex $md5.ComputeHash([Text.Encoding]::Unicode.GetBytes($h1 + $h2 + $h3))
          $b64  = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($full))

          $note = ''
          if ($attempt -gt 1) { $note = "**Tunnel restarted (attempt $attempt). Any earlier address is dead.**`n" }

          @(
            '## Windows VM is live', '', $note,
            ('- **User:** `' + $user + '`'),
            ('- **Password:** the `RDP_PASSWORD` repository secret'),
            ('- **Connect to:** `' + $h + ':' + $port + '`'), '',
            '```', ('mstsc /v:' + $h + ':' + $port + ' /u:' + $user + ' /pth:' + $b64), '```', '',
            'If `/pth` is ignored, type the host and port in manually.'
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

          Write-Host "CONNECT host=$h port=$port user=$user attempt=$attempt"
          Write-Host "MSTSC mstsc /v:${h}:${port} /u:${user} /pth:${b64}"

          try {
            $repo = $env:GITHUB_REPOSITORY
            $payload = [ordered]@{
              host = $h; port = $port; user = $user; attempt = $attempt
              updated = (Get-Date).ToUniversalTime().ToString('o')
              note = 'Read this file for the current tunnel address.'
            } | ConvertTo-Json
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload))

            gh api "repos/$repo/git/refs/heads/live-status" 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $mainSha = (gh api "repos/$repo/git/ref/heads/main" --jq .object.sha).Trim()
              gh api "repos/$repo/git/refs" --method POST -f ref="refs/heads/live-status" -f sha=$mainSha | Out-Null
            }

            $cur = gh api "repos/$repo/contents/live.json?ref=live-status" --jq .sha 2>$null
            if ($cur) {
              gh api "repos/$repo/contents/live.json" --method PUT -f message="live tunnel status" -f content=$b64 -f sha=$cur.Trim() -f branch=live-status | Out-Null
            } else {
              gh api "repos/$repo/contents/live.json" --method POST -f message="live tunnel status" -f content=$b64 -f branch=live-status | Out-Null
            }
            Write-Host 'published live.json to live-status branch'
          } catch {
            Write-Host "could not publish live.json: $($_.Exception.Message)"
          }
        }

        $attempt = 0
        while ($true) {
          $attempt++
          $t = Start-Tunnel $attempt

          $info = $null
          for ($i = 0; $i -lt 45 -and -not $info; $i++) {
            Start-Sleep -Seconds 2
            $info = Get-TunnelHost $t
          }

          if (-not $info) {
            Write-Host "attempt ${attempt}: cloudflared never reported a hostname"
            Get-Content ($t.Out + '.err') -ErrorAction SilentlyContinue | Write-Host
            if ($attempt -ge 3) { throw 'tunnel failed to start 3 times in a row' }
            continue
          }

          Write-ConnectInfo $info.Host $info.Port $attempt

          while (-not $t.Proc.HasExited) { Start-Sleep -Seconds 30 }

          Write-Host "tunnel process exited (code $($t.Proc.ExitCode)); restarting in 5s"
          Start-Sleep -Seconds 5
        }
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
